<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimi Search | Independent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-white text-gray-900 font-sans">

    <div id="search-container" class="transition-all duration-500 flex flex-col items-center justify-center min-h-screen">
        <h1 class="text-5xl font-extrabold mb-8">
            <span class="text-indigo-600">Mimi</span><span class="text-gray-400">Search</span>
        </h1>
        
        <div class="w-full max-w-xl px-4">
            <div class="relative flex items-center">
                <input type="text" id="query" 
                    class="w-full p-4 pl-12 rounded-2xl border-2 border-gray-100 bg-gray-50 focus:bg-white focus:border-indigo-400 focus:outline-none shadow-lg transition-all"
                    placeholder="Search the independent web...">
                <i class="fas fa-search absolute left-4 text-gray-400"></i>
                <button onclick="runSearch()" class="ml-2 bg-indigo-600 text-white px-6 py-4 rounded-2xl hover:bg-indigo-700 font-bold">Search</button>
            </div>
            <p class="text-center text-xs text-gray-400 mt-4">Powered by Brave Independent Index</p>
        </div>
    </div>

    <main id="results-wrapper" class="max-w-4xl mx-auto px-6 py-10 hidden">
        <div id="results-list" class="space-y-10">
            </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
