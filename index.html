<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimi Search | Open Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 transition-all duration-300">

    <div id="main-container" class="flex flex-col items-center justify-center min-h-screen transition-all duration-700">
        <h1 id="logo" class="text-6xl font-black text-indigo-600 mb-8 tracking-tighter">
            Mimi<span class="text-slate-300">Search</span>
        </h1>

        <div class="w-full max-w-xl px-6 relative">
            <div class="flex shadow-2xl rounded-2xl overflow-hidden border border-white">
                <input type="text" id="searchInput" 
                    class="w-full p-5 outline-none text-lg bg-white" 
                    placeholder="Search anything..." autocomplete="off">
                <button onclick="performSearch()" class="bg-indigo-600 text-white px-8 hover:bg-indigo-700 transition">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div id="suggestions" class="absolute w-[calc(100%-3rem)] bg-white border-t mt-1 rounded-b-2xl shadow-xl hidden z-50"></div>
        </div>

        <div id="instant-answer" class="max-w-xl mt-8 px-6 hidden">
            <div class="bg-white p-6 rounded-2xl shadow-md border-l-4 border-indigo-500">
                <h2 id="answer-title" class="font-bold text-xl mb-2"></h2>
                <p id="answer-body" class="text-slate-600"></p>
                <a id="answer-link" href="#" target="_blank" class="text-indigo-500 text-sm mt-3 inline-block hover:underline">Read more →</a>
            </div>
        </div>

        <p id="footer-text" class="mt-10 text-slate-400 text-sm">No keys. No tracking. Just Mimi.</p>
    </div>

    <div id="results-container" class="max-w-4xl mx-auto px-6 py-10 hidden">
        <h3 class="text-slate-400 mb-6 uppercase tracking-widest text-xs font-bold">Web Results</h3>
        <div id="web-results" class="space-y-8"></div>
        <div class="mt-10 pt-10 border-t text-center">
            <button onclick="window.location.reload()" class="text-indigo-600 font-bold underline">Go Back Home</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
